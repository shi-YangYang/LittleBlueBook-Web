name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Project foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://littlebluebook:littlebluebook-ci@127.0.0.1:5432/littlebluebook
      REDIS_URL: redis://127.0.0.1:6379
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      SWAGGER_ENABLED: 'true'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: littlebluebook
          POSTGRES_PASSWORD: littlebluebook-ci
          POSTGRES_DB: littlebluebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littlebluebook -d littlebluebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4.1.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CI configuration
        run: pnpm ci:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run unit and integration tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps --no-shell chromium

      - name: Run browser end-to-end tests
        run: pnpm test:e2e

      - name: Build applications
        run: pnpm build

      - name: Build production containers
        run: pnpm docker:build

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/coverage/
            backend/coverage/
            e2e/playwright-report/
            e2e/test-results/
